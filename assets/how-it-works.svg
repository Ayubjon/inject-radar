<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="1010" height="300" rx="14" fill="#f6f8fa"/>
  <text x="28" y="42" font-size="21" font-weight="700" fill="#1f2328">inject-radar — prompt-injection scanner &amp; CI gate</text>
  <text x="28" y="66" font-size="13" fill="#57606a">Normalizes hidden tricks, scores risk 0–100 with reasons, gates your build — locally, no LLM, no deps.</text>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#57606a"/>
    </marker>
  </defs>

  <!-- input -->
  <rect x="20" y="104" width="220" height="92" rx="9" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="130" y="130" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">Untrusted input</text>
  <text x="130" y="153" font-size="11" fill="#57606a" text-anchor="middle" font-family="monospace">"ignore previous…"</text>
  <text x="130" y="172" font-size="10" fill="#cf222e" text-anchor="middle">zero-width · homoglyphs · base64</text>

  <!-- scan -->
  <rect x="310" y="104" width="160" height="92" rx="9" fill="#dbeafe" stroke="#2d7ff9" stroke-width="1.5"/>
  <text x="390" y="142" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle" font-family="monospace">scan()</text>
  <text x="390" y="163" font-size="10.5" fill="#57606a" text-anchor="middle">normalize + match</text>

  <!-- score -->
  <rect x="540" y="104" width="190" height="92" rx="9" fill="#fee2e2" stroke="#cf222e" stroke-width="1.5"/>
  <text x="635" y="142" font-size="22" font-weight="800" fill="#cf222e" text-anchor="middle">100</text>
  <text x="635" y="163" font-size="11" fill="#1f2328" text-anchor="middle">risk: critical · + reasons</text>

  <!-- outcomes -->
  <rect x="800" y="98" width="200" height="44" rx="8" fill="#fff7ed" stroke="#d4a72c" stroke-width="1.5"/>
  <text x="900" y="125" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">Inline: block / sanitize</text>
  <rect x="800" y="158" width="200" height="44" rx="8" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
  <text x="900" y="185" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">CI: fail the build</text>

  <!-- arrows -->
  <line x1="242" y1="150" x2="306" y2="150" stroke="#57606a" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="274" y="141" font-size="10.5" fill="#57606a" text-anchor="middle">normalize</text>
  <line x1="472" y1="150" x2="536" y2="150" stroke="#57606a" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="732" y1="140" x2="796" y2="120" stroke="#57606a" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="732" y1="160" x2="796" y2="180" stroke="#57606a" stroke-width="1.6" marker-end="url(#arr)"/>
</svg>
